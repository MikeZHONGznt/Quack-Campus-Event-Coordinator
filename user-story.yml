name: User story
description: A small, testable unit of work written from a user's perspective
title: "[Story] "
labels: ["user story"]
body:
  - type: input
    id: feature
    attributes:
      label: Parent feature
      placeholder: "#5"
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      value: |
        As a <role>, I can <action> so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Specific and testable. A tester should be able to work only from these
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 core loop
        - P1 planned
        - P2 stretch
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Edge cases, dependencies, or links to the technical design
