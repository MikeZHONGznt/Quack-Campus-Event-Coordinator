name: Epic
description: A large body of work that groups related features
title: "[Epic] "
labels: ["epic"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What this epic covers, in two or three sentences
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Value delivered
      description: Why this matters to a Stevens student or to the team
    validations:
      required: true
  - type: textarea
    id: features
    attributes:
      label: Features in this epic
      description: Link the child feature issues here as a checklist
      value: |
        - [ ] #
  - type: textarea
    id: done
    attributes:
      label: Definition of done
    validations:
      required: true
