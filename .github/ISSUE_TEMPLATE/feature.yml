name: Feature
description: A capability that delivers value, made of several user stories
title: "[Feature] "
labels: ["feature"]
body:
  - type: input
    id: epic
    attributes:
      label: Parent epic
      placeholder: "#1"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: stories
    attributes:
      label: User stories
      value: |
        - [ ] #
  - type: textarea
    id: done
    attributes:
      label: Definition of done
    validations:
      required: true
