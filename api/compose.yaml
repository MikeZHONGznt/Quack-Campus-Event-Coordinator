# Local development database only. Deployed environments use the hosted Postgres.
services:
  postgres:
    image: postgis/postgis:16-3.4
    labels:
      # Spring Boot only auto-detects the plain postgres image; this tells it PostGIS is Postgres.
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: quack
      POSTGRES_USER: quack
      POSTGRES_PASSWORD: quack
    ports:
      - "5432:5432"
    volumes:
      - quack-db:/var/lib/postgresql/data

volumes:
  quack-db:
